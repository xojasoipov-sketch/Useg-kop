name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# IMPORTANT: do NOT cancel in-progress deploys — that breaks gh-pages mid-push
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site (full omnicode/frontend → _site)
        run: |
          set -euo pipefail

          if [ ! -f omnicode/frontend/index.html ]; then
            echo "ERROR: omnicode/frontend/index.html missing"
            exit 1
          fi

          rm -rf _site
          mkdir -p _site

          # Copy entire frontend tree (html, js, css, assets, subfolders)
          cp -a omnicode/frontend/. _site/

          # Favicon fallback from repo root
          if [ ! -f _site/favicon.svg ] && [ -f favicon.svg ]; then
            cp favicon.svg _site/favicon.svg
          fi

          # Ensure favicon link in index
          if [ -f _site/favicon.svg ] && ! grep -q 'rel="icon"' _site/index.html; then
            sed -i 's|<title>|<link rel="icon" type="image/svg+xml" href="favicon.svg">\n<title>|' _site/index.html
          fi

          # GitHub Pages: disable Jekyll so _files work
          touch _site/.nojekyll

          # Build stamp (cache-bust proof)
          {
            echo "build=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "primary=omnicode/frontend"
            echo "commit=${GITHUB_SHA}"
          } > _site/VERSION.txt

          # Required assets must exist
          for f in index.html app.js brain.js pro-ui.js features.js styles/main.css; do
            if [ ! -f "_site/$f" ]; then
              echo "ERROR: missing required asset: $f"
              find _site -type f | sort
              exit 1
            fi
          done

          # Optional legacy backup
          mkdir -p _site/legacy
          if [ -f index.html ]; then
            cp index.html _site/legacy/ 2>/dev/null || true
            for f in style.css app.js agents.js favicon.svg; do
              [ -f "$f" ] && cp "$f" _site/legacy/ || true
            done
          fi

          echo "=== _site files ==="
          find _site -type f | sort
          echo "=== script tags in index ==="
          grep -E 'src=|href=' _site/index.html | head -40

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          # Keep history of last deploy content stable; orphan still OK if full copy verified above
          force_orphan: true
          commit_message: 'deploy: OmniCode frontend ${{ github.sha }}'
