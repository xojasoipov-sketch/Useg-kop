name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/shuni-chuntr-va-qil-60bfra]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site (premium dashboard)
        run: |
          mkdir -p site
          # Premium 3-column dashboard from omnicode/frontend
          cp omnicode/frontend/index.html site/index.html
          mkdir -p site/styles
          cp omnicode/frontend/styles/pro-dashboard.css site/styles/pro-dashboard.css
          cp omnicode/frontend/app.js site/app.js
          # Brain modules (ES modules)
          mkdir -p site/brain
          cp -r omnicode/frontend/brain/* site/brain/ 2>/dev/null || true
          # Utils if any
          mkdir -p site/utils
          cp -r omnicode/frontend/utils/* site/utils/ 2>/dev/null || true
          # Fallback root assets
          cp agents.js site/agents.js 2>/dev/null || true
          echo "build=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > site/VERSION.txt
          echo "source=omnicode/frontend" >> site/VERSION.txt
          ls -la site/
          ls -la site/styles/ 2>/dev/null || true
          ls -la site/brain/ 2>/dev/null || true

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
