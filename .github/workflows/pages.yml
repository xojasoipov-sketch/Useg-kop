name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site (omnicode/frontend)
        run: |
          set -euo pipefail

          if [ ! -f omnicode/frontend/index.html ]; then
            echo "ERROR: omnicode/frontend/index.html missing"
            exit 1
          fi

          rm -rf _site
          mkdir -p _site

          # Full frontend copy
          cp -a omnicode/frontend/. _site/

          # Favicon from root if missing
          if [ ! -f _site/favicon.svg ] && [ -f favicon.svg ]; then
            cp favicon.svg _site/favicon.svg
          fi

          # Ensure favicon link
          if [ -f _site/favicon.svg ] && ! grep -q 'rel="icon"' _site/index.html; then
            sed -i 's|<title>|<link rel="icon" type="image/svg+xml" href="favicon.svg">\n<title>|' _site/index.html
          fi

          touch _site/.nojekyll

          {
            echo "build=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "primary=omnicode/frontend"
            echo "commit=${GITHUB_SHA}"
            echo "method=github-actions-official"
          } > _site/VERSION.txt

          for f in index.html app.js brain.js pro-ui.js features.js styles/main.css; do
            if [ ! -f "_site/$f" ]; then
              echo "ERROR: missing required asset: $f"
              find _site -type f | sort
              exit 1
            fi
          done

          echo "=== _site files ==="
          find _site -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
