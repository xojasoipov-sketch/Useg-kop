name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/shuni-chuntr-va-qil-60bfra]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp style.css site/style.css 2>/dev/null || true
          cp app.js site/app.js 2>/dev/null || true
          cp app.html site/app.html 2>/dev/null || true
          echo "build=$(date -u +%Y-%m-%dT%H:%M:%SZ)" > site/VERSION.txt

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force_orphan: true
