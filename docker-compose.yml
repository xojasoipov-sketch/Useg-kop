version: '3.8'

services:
  omniroute-proxy:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    networks:
      - omnicode

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./omnicode/frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - omniroute-proxy
    networks:
      - omnicode
    environment:
      VITE_API_URL: http://omniroute-proxy:3000

networks:
  omnicode:
    driver: bridge
